[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "renglo-lib"
version = "0.0.18"
description = "Core Renglo functionality - controllers, models, and utilities"
license = { text = "MIT" }
authors = [
    {name = "Renglo Team"}
]
requires-python = ">=3.12"
dependencies = [
    "boto3==1.43.72",
    "botocore==1.43.72",
    "PyJWT==2.10.1",
    "cryptography==50.0.2",
    "Requests==2.32.3",
    "validate_email==1.3",
    "openai==1.65.2",
    "Pillow==11.1.0",
    "azure-cosmos==4.17.1",
    "azure-identity==1.27.0",
    "azure-storage-blob==12.26.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
renglo = ["auth/blueprints/*.json", "chat/blueprints/*.json"]

[tool.renglo]
platform = "0.1.15"

